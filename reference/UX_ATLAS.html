<body>
<div class="app"><header class="mast"><div class="mast-left"><div class="brand"><span class="brand-logo" aria-hidden="true">◈</span><span class="brandtext">InfoSlips <span style="font-weight:500;color:#b5d4e5">Spatial Studio</span></span></div><span class="pill amber">UX DESIGN ATLAS · NOT THE CCM ENGINE</span></div><div class="mast-right"><span class="small muted">Project</span><select id="project" aria-label="Select demo project"><option value="card">Aster Card · Credit statement</option><option value="eob">HarborCare · Healthcare EOB</option></select><span class="small muted">Persona</span><select id="persona" aria-label="Select demo persona"><option value="current">Everyday · Current</option><option value="overdue">Missed payments</option><option value="assist">Assistance requested</option><option value="premium">Premier customer</option></select><button class="subtle small" id="goGuide">▶ Guided tour</button></div></header>
<nav class="nav" id="nav" aria-label="UX screens"></nav><main class="stage"><div class="heading-row"><div><div class="eyebrow" id="screenNumber">SCREEN 01 / 12</div><h1 id="title">Project Gallery</h1><div class="subtitle" id="subtitle"></div></div><div class="control-row"><span class="pill cyan" id="screenType">MAIN WORKSPACE</span><button id="backBtn">← Previous</button><button id="nextBtn" class="primary">Next screen →</button></div></div>
<div class="workbench"><aside class="panel" id="leftPane"></aside><section class="mid"><div class="toolbar"><span id="toolbarLeft">Design review</span><span id="toolbarRight">Synthetic demo data · v0.1</span></div><div class="surface" id="surface" role="region" aria-label="UX mock screen"></div><div class="bottomdock" id="bottomDock"></div></section><aside class="rightcol"><div class="panel" id="rightPane"></div></aside></div>
<div class="about" id="screenNotes"></div></main><footer class="footerbar"><span><strong>Design intent:</strong> shared model · persistent selection · meaningful depth</span><span>Self-contained interactive UX atlas · Final branding pending</span></footer></div>
<script>
const screens=[
{id:'S01',name:'Project Gallery',icon:'▦',tag:'ENTRY',sub:'Start from one of two editable, fictional communication projects or a clean demonstration state.',goal:'One-click entry into Aster Card and HarborCare; visible seeded-versus-edited status. No mandatory setup.'},
{id:'S02',name:'2D Design Studio',icon:'▤',tag:'AUTHOR',sub:'Edit accurate page geometry and responsive layout profiles with the same semantic component tree.',goal:'Grab a Conditional Region, resize or edit it, bind data, and open the spatial variant view without changing component identity.'},
{id:'S03',name:'Exploded Document',icon:'◈',tag:'SIGNATURE 2.5D',sub:'Pull a single conditional section into space and understand all possible variants and why each appears.',goal:'Depth represents variants only. The original page remains the context plane. Select any panel to inspect rule and data lineage.'},
{id:'S04',name:'Document Cube',icon:'⬡',tag:'DIMENSIONAL',sub:'Choose three independent scenario dimensions and inspect populated or empty intersections.',goal:'Axes are configurable and always labeled; select a cell for a representative scenario and rendered outcome.'},
{id:'S05',name:'Scenario Landscape',icon:'◌',tag:'ANALYTICS',sub:'Reveal outcome clusters, synthetic reach, exceptions and the evaluated scenario coverage.',goal:'Size encodes synthetic population; severity stays explicit, and 2D grouped-table mode remains available.'},
{id:'S06',name:'Page Composition Stack',icon:'▥',tag:'COMPOSITION',sub:'Stack real paginated compositions to understand continuation, overflow, or different scenario outcomes.',goal:'Page count comes from the composition adapter, not this illustration. HTML is a separate responsive preview.'},
{id:'S07',name:'Rules & Data',icon:'⫶',tag:'LOGIC',sub:'Define and inspect typed conditional decisions, data bindings and the decision trace.',goal:'No arbitrary executable expressions. Contradictions, no-match and inaccessible paths are diagnostic states.'},
{id:'S08',name:'Journey Simulator',icon:'◷',tag:'TIME',sub:'Edit a customer-event timeline and compare future communication states.',goal:'Issued statements are immutable; new events recompute future previews without rewriting the issued record.'},
{id:'S09',name:'Validate & Compare',icon:'✓',tag:'QUALITY',sub:'Find real rule, page, parity and basic accessibility issues and navigate directly to the cause.',goal:'Validation must be backed by deterministic checks; this atlas displays illustrative findings only.'},
{id:'S10',name:'Preview & Export',icon:'⇪',tag:'OUTPUT',sub:'Compare paged PDF, responsive interactive HTML, and a labeled AFP feasibility simulation.',goal:'PDF and HTML become real artifacts in the implementation. The atlas only previews their intended UI.'},
{id:'S11',name:'Guided Demo',icon:'▶',tag:'STORY',sub:'Deliver a repeatable seven-to-eight-minute stakeholder story through genuine app actions.',goal:'A presenter can pause, explore freely, recover, or reset to known data without relying on online AI.'},
{id:'S12',name:'AI Assistant',icon:'✧',tag:'ASSIST',sub:'Natural language explores and explains synthetic scenarios; all mutations are approval-gated.',goal:'AI never owns the rules engine. Model output is translated to constrained commands and validated before execution.'}
];
let index=1,variant='Standard payment',journey=0,cubeX='Persona',cubeY='Output',cubeZ='Journey',stress=false,issue='R03',screenProject='card';
const $=id=>document.getElementById(id);
const isEob=()=> $('project').value==='eob';
const currentVariant=()=>isEob()?'Covered claim explanation':({current:'Standard payment',overdue:'Missed payment',assist:'Assistance invitation',premium:'Standard payment'})[$('persona').value];
const currentRule=()=>isEob()?'R13':({current:'R01',overdue:'R02',assist:'R04',premium:'R01 + R06'})[$('persona').value];
const selectedNode=()=>isEob()?'claim-explanation':'payment-guidance';

function btn(label,action,cls=''){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function pane(title,body){return `<div class="panelhead"><span>${title}</span><span class="muted tiny">⋯</span></div><div class="panelbody">${body}</div>`}
function paper(small=false){const isEob=$('project').value==='eob';return `<div class="paper" ${small?'style="transform:scale(.85);transform-origin:center"':''}><div class="paperbrand">${isEob?'harbor<span style="color:#29a1aa">care</span>':'aster<span style="color:#28aaaa">card</span>'}<i>DEMO DATA</i></div><h2>${isEob?'Explanation of benefits':'November account statement'}</h2><div class="minirow"><span>${isEob?'Member: Jordan Rivera':'Cardholder: Jordan Rivera'}</span><strong>${isEob?'NOT A BILL':'•••• 4812'}</strong></div><div class="ruled"></div><div class="minirow"><span>${isEob?'Allowed amount':'Statement balance'}</span><strong>${isEob?'$480.00':'$1,248.00'}</strong></div><div class="minirow"><span>${isEob?'Plan paid':'Minimum payment'}</span><strong>${isEob?'$310.00':'$48.00'}</strong></div><div class="minirow"><span>${isEob?'Claim state':'Payment due'}</span><strong>${isEob?'Processed':'Dec 18, 2026'}</strong></div><div class="payment"><b style="font-size:10px">${isEob?'Your benefit explanation':'Payment guidance'}</b><div class="tiny" style="font-size:9px;margin-top:5px">${isEob?'This explains how your claim was processed.':$('persona').value==='assist'?'Let’s discuss repayment options that suit you.':$('persona').value==='overdue'?'Your recent payment has not arrived.':'See convenient ways to make a payment.'}</div><span class="handle" data-action="explode" title="Explore variants">◇</span></div><table><thead><tr><th>${isEob?'Service':'Transaction'}</th><th>Date</th><th>Amount</th></tr></thead><tbody>${[0,1,2,3,4].map((x)=>`<tr><td>${isEob?['Office visit','Lab services','Imaging','Consult','Claim adjustment'][x]:['Grocery Market','Public Transit','Fuel Station','Online Shop','Dining'][x]}</td><td>11/${12+x}</td><td>$${[45,17,68,122,29][x]}.00</td></tr>`).join('')}</tbody></table><div class="footer"><span>Illustrative content · not a legal statement</span><span>01 / 03</span></div></div>`}
function left(){const s=screens[index];if(index===0)return pane('Available templates',`<div class="paletteitem">▤ &nbsp; Credit statement</div><div class="paletteitem">▤ &nbsp; Healthcare EOB</div><div class="note">Projects share the same 15-component catalog and rendering architecture.</div>`);
if([1,2,5].includes(index))return pane('Components / Layers',`<div class="eyebrow">Component palette</div>${[['⊞','Container'],['T','Rich text'],['◇','Conditional region'],['≡','Repeating table'],['⚑','Disclosure']].map(x=>`<div class="paletteitem" draggable="true"><b>${x[0]}</b>${x[1]}</div>`).join('')}<div class="eyebrow" style="margin:17px 0 7px">Document tree</div>${isEob()?'<div class="tree">▸ Member header</div><div class="tree">▸ Claims summary</div><div class="tree sel">▸ Claim Explanation <span class="pill cyan">4</span></div><div class="tree">▸ Claims table</div><div class="tree">▸ Not a Bill notice</div>':'<div class="tree">▸ Statement header</div><div class="tree">▸ Account summary</div><div class="tree sel">▸ Payment Guidance <span class="pill cyan">4</span></div><div class="tree">▸ Transaction table</div><div class="tree">▸ Disclosures</div>'}`);
if(index===3)return pane('Cube dimensions',`<div class="field"><label class="fieldlabel">X axis</label><div class="fakeinput" id="leftCubeX">${cubeX}</div></div><div class="field"><label class="fieldlabel">Y axis</label><div class="fakeinput">${cubeY}</div></div><div class="field"><label class="fieldlabel">Z axis</label><div class="fakeinput">${cubeZ}</div></div><div class="note">Display at most five categories per axis. Filter or slice to remove occlusion.</div>`);
if(index===4)return pane('Landscape filters',`<div class="paletteitem">☑ &nbsp; All outcomes</div><div class="paletteitem">⚠ &nbsp; Show risks only</div><div class="paletteitem">◷ &nbsp; Journey: all stages</div><div class="paletteitem">▣ &nbsp; Source: seeded records</div><div class="note">Population estimates are synthetic, not actual customer analytics.</div>`);
if(index===6)return pane('Rule sets',`<div class="tree sel">R03 · Support offer</div><div class="tree">R04 · Assistance requested</div><div class="tree">R05 · Arrangement active</div><div class="tree">R07 · Spanish copy</div><div class="tree">R12 · Mandatory card</div><div class="note">Resolve exclusive group with explicit precedence and fallbacks.</div>`);
if(index===7)return pane('Journey events',`<div class="tree">① statement.issued</div><div class="tree">② payment.missed</div><div class="tree sel">③ assistance.requested</div><div class="tree">④ arrangement.approved</div><div class="note">Event payloads can be edited; issued snapshots cannot.</div>`);

axisZ"><option ${cubeZ==='Journey'?'selected':''}>Journey</option><option ${cubeZ==='Language'?'selected':''}>Language</option><option ${cubeZ==='Output'?'selected':''}>Output</option><option ${cubeZ==='Persona'?'selected':''}>Persona</option></select></label></div>`;break;
case 4:mid=`<div class="surfhead"><span class="glass">○ Outcome grouping: resolved variant signature</span><span class="glass">100 / 100 seeded fixtures · illustrative positions</span></div><div class="landscape"><svg viewBox="0 0 700 380" width="100%" height="100%"><defs><radialGradient id="sgr"><stop stop-color="#5f9dd4" stop-opacity=".25"/><stop offset="1" stop-color="#5f9dd4" stop-opacity="0"/></radialGradient></defs><ellipse cx="350" cy="210" rx="315" ry="145" fill="url(#sgr)"/><g stroke="#527699" stroke-width="1" stroke-dasharray="4 7" opacity=".6"><path d="M120 250 L280 110 L440 240 L575 95 M280 110 L570 305 M440 240 L210 310"/></g>${[[120,235,54,'62','#2fd1c1','Standard'],[275,102,41,'23','#a692fc','Assistance'],[442,220,30,'12','#e7bd64','Premium'],[570,95,23,'3','#fa7d81','Exceptions'],[210,315,20,'6','#5aa4f0','High volume'],[562,300,20,'8','#48b0a3','Digital']].map(a=>`<g data-action="cluster" tabindex="0" role="button" aria-label="${a[5]} cluster" style="cursor:pointer"><circle cx="${a[0]}" cy="${a[1]}" r="${a[2]+9}" fill="${a[4]}" opacity=".12"/><circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" fill="${a[4]}" opacity=".72" stroke="#e8fbff" stroke-opacity=".6" stroke-width="2"/><text x="${a[0]}" y="${a[1]+5}" fill="#081928" text-anchor="middle" font-size="17" font-weight="800">${a[3]}</text><text x="${a[0]}" y="${a[1]+a[2]+21}" text-anchor="middle" fill="#d7ebf5" font-size="12">${a[5]}</text></g>`).join('')}</svg></div>`;break;

case 6:mid=`<div class="surfhead"><span class="glass">⫶ Rule Builder · R03 · exclusive group</span><span class="glass">Expression AST · no arbitrary script</span></div><div style="max-width:620px;margin:72px auto 0;position:relative;z-index:2;padding:0 16px"><div class="listbox"><span class="eyebrow">WHEN</span><div style="font-size:16px;font-weight:750;margin:8px 0">missedPayments <span style="color:var(--teal)">≥</span> 2</div></div><div style="text-align:center;color:var(--teal)">AND</div><div class="listbox"><span class="eyebrow">IF</span><div style="font-size:16px;font-weight:750;margin:8px 0">assistanceRequested <span style="color:var(--teal)">=</span> false</div></div><div style="text-align:center;color:var(--teal)">↓ THEN</div><div class="listbox"><b>SELECT VARIANT</b> <span class="capsule">payment-support-offer</span></div><div class="note">Priority 80 · Diagnostic: inconsistent input if “current” and 2 missed payments.</div></div>`;break;
case 7:mid=`<div class="surfhead"><span class="glass">◷ Customer journey · editable event stream</span><span class="glass">Issued record remains immutable</span></div><div style="position:relative;z-index:2;padding-top:90px"><div class="journey-track">${[['Issued',1,'statement.issued'],['Missed',30,'payment.missed'],['Assistance',45,'assistance.requested'],['Approved',60,'arrangement.approved']].map((e,i)=>`<button data-action="journey:${i}" class="eventcard ${journey===i?'active':''}"><span class="tiny muted">${e[0]}</span><div class="day">Day ${e[1]}</div><div class="small">${e[2]}</div><div class="pill ${i===0?'cyan':''}" style="display:inline-block;margin-top:12px">${i===0?'IMMUTABLE':'RECOMPUTED'}</div></button>`).join('')}</div><div class="glass" style="margin:5px 18px;max-width:800px">Selected result: <strong>${['Standard statement issued','Payment reminder preview','Assistance invitation preview','Arrangement guidance preview'][journey]}</strong> · New future state, not a change to the issued record.</div></div>`;break;
case 8:mid=`<div class="surfhead"><span class="glass">✓ Validation run · synthetic defects enabled</span><span class="glass">Errors 1 · Warnings 2 · Passed 42 (illustrative)</span></div><div class="issues" style="position:relative;z-index:2;padding-top:73px"><div class="issue" data-action="rules"><span class="pill red">ERROR</span><div><b>Conflicting exclusive variants</b><span class="muted small">payment-guidance · R03 and duplicate variant priority</span></div><span class="small">›</span></div><div class="issue" data-action="stack"><span class="pill amber">WARNING</span><div><b>Table continuation risk</b><span class="muted small">250 transaction rows · page flow region requires continuation</span></div><span class="small">›</span></div><div class="issue" data-action="design"><span class="pill amber">WARNING</span><div><b>Missing Spanish disclosure variant</b><span class="muted small">Disclosure node · mandatory content fallback missing</span></div><span class="small">›</span></div></div>`;break;
case 9:mid=`<div class="surfhead"><span class="glass">⇪ Output comparison · shared resolved semantic tree</span><span class="glass">PDF real in build · HTML real in build · AFP simulation</span></div><div style="display:flex;align-items:center;justify-content:space-evenly;height:100%;padding:80px 10px 20px;position:relative;z-index:2"><div style="transform:scale(.66);transform-origin:center;margin:-65px">${paper()}</div><div style="width:245px;min-height:350px;background:#fff;color:#1b3a50;border-radius:20px;border:7px solid #0d2036;box-shadow:0 25px 50px #0008;padding:14px"><div style="font-size:13px;font-weight:850">astercard</div><div style="font-size:10px;margin:10px 0">Your statement</div><div style="font-size:25px;font-weight:850">$1,248.00</div><div style="font-size:10px;margin:8px 0">Due December 18</div><div style="background:#eaf8f7;padding:12px;border-radius:9px;font-size:11px;margin-top:14px">Payment guidance<br><b>${$('persona').value==='assist'?'Explore repayment options':'Pay your statement'}</b></div><div style="background:#177d82;padding:11px;border-radius:8px;color:white;text-align:center;margin-top:12px;font-size:11px">Explore options</div><div style="font-size:10px;margin-top:15px">▾ Transactions · Sort & filter</div></div><div style="border:1px dashed #f7bf66;background:#302b27;border-radius:9px;padding:22px;text-align:center"><div style="font-size:30px">▣</div><b>AFP</b><div class="tiny">SIMULATION ONLY</div></div></div>`;break;

return mid}
function render(){let s=screens[index];$('nav').innerHTML=`<div class="navsection">UX SCREENS</div>`+screens.map((x,i)=>`<button class="navitem ${i===index?'active':''}" data-screen="${i}"><span class="ico">${x.icon}</span><span>${x.name}</span><small>${String(i+1).padStart(2,'0')}</small></button>`).join('')+`<div class="navfoot">Concept navigation only.<br>All sample names and values are fictional.<br><br>Use <span class="ks">←</span> <span class="ks">→</span> to navigate.</div>`;
$('screenNumber').innerText=`SCREEN ${String(index+1).padStart(2,'0')} / 12 · ${s.id}`;$('title').innerText=s.name;$('subtitle').innerText=s.sub;$('screenType').innerText=s.tag;$('leftPane').innerHTML=left();$('rightPane').innerHTML=right();$('surface').innerHTML=screenSurface();$('toolbarLeft').innerHTML=`<b>${s.icon} ${s.name}</b> &nbsp; · &nbsp; ${$('project').value==='eob'?'HarborCare EOB':'Aster Card'}`;$('toolbarRight').innerText='Illustrative UX screens · not a functional composer';$('bottomDock').innerHTML=`<div class="control-row"><span class="pill cyan">Selected: C11 · ${selectedNode()}</span><span class="muted">Persona: ${$('persona').selectedOptions[0].text}</span></div><div class="footer-actions"><span class="pill">PDF profile</span><span class="pill">HTML profile</span><span class="pill amber">AFP simulation</span></div>`;$('screenNotes').innerHTML=`<strong style="color:#d7f7ee">UX contract:</strong> ${s.goal}`;
$('backBtn').disabled=index===0;$('nextBtn').disabled=index===screens.length-1;
}
function nav(i){index=Math.max(0,Math.min(11,i));render();}
function action(a){if(a==='explode')nav(2);else if(a==='design')nav(1);else if(a==='gallery')nav(0);else if(a==='openEob'){$('project').value='eob';nav(1)}else if(a==='rules')nav(6);else if(a==='stack')nav(5);else if(a==='stress'){stress=!stress;render()}else if(a==='cluster')nav(2);else if(a==='cubeCell')nav(2);else if(a.startsWith('journey:')){journey=+a.split(':')[1];render()}else if(a.startsWith('selectVariant:')){variant=a.split(':')[1];render()}}
document.addEventListener('click',e=>{let s=e.target.closest('[data-screen]');if(s){nav(+s.dataset.screen);return}let a=e.target.closest('[data-action]');if(a)action(a.dataset.action)});$('backBtn').onclick=()=>nav(index-1);$('nextBtn').onclick=()=>nav(index+1);$('goGuide').onclick=()=>nav(10);$('persona').onchange=()=>{variant=currentVariant();render()};$('project').onchange=()=>{variant=currentVariant();render()};document.addEventListener('change',e=>{if(['axisX','axisY','axisZ'].includes(e.target.id)){let v=[...['axisX','axisY','axisZ'].map(id=>$(id)?.value)];if(new Set(v).size<3){alert('Choose three distinct dimensions.');render();return;}[cubeX,cubeY,cubeZ]=v;render();}});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')nav(index+1);if(e.key==='ArrowLeft')nav(index-1)});render();
</script></body></html>
